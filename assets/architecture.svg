<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 472" role="img" aria-labelledby="title desc">
  <title id="title">Architecture philosophy</title><desc id="desc">A disciplined cycle moving from problem to abstraction, design, interfaces, deployment, and iteration.</desc>
  <defs>
    <symbol id="block" viewBox="0 0 160 104"><rect width="160" height="104" rx="8" fill="#161B22" stroke="#30363D"/><path d="M20 72h120" stroke="#30363D"/></symbol>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#58A6FF"/></marker>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#58A6FF"/><stop offset="1" stop-color="#D2A8FF"/></linearGradient>
  </defs><rect width="1200" height="472" fill="#0D1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="48" y="52" fill="#58A6FF" font-size="14" font-weight="700" letter-spacing="2">ARCHITECTURE PHILOSOPHY / 06</text><text x="48" y="92" fill="#F0F6FC" font-size="30" font-weight="700">Make the next decision cheaper than the last.</text><text x="48" y="124" fill="#8B949E" font-size="16">Architecture is a learning loop: each boundary should preserve options and expose evidence.</text></g>
  <g aria-label="Architecture process" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path d="M128 270h944" fill="none" stroke="url(#flow)" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M292 270h24M476 270h24M660 270h24M844 270h24" stroke="#58A6FF" stroke-width="2" marker-end="url(#arrowhead)"/>
    <use href="#block" x="48" y="218" width="160" height="104"/><use href="#block" x="232" y="218" width="160" height="104"/><use href="#block" x="416" y="218" width="160" height="104"/><use href="#block" x="600" y="218" width="160" height="104"/><use href="#block" x="784" y="218" width="160" height="104"/><use href="#block" x="968" y="218" width="160" height="104"/>
    <g fill="#F0F6FC" font-size="17" font-weight="700"><text x="72" y="256">Problem</text><text x="256" y="256">Abstraction</text><text x="440" y="256">Design</text><text x="624" y="256">Interfaces</text><text x="808" y="256">Deployment</text><text x="992" y="256">Iteration</text></g><g fill="#8B949E" font-size="13"><text x="72" y="294">Observe the constraint</text><text x="256" y="294">Name the invariants</text><text x="440" y="294">Choose the trade-offs</text><text x="624" y="294">Make contracts explicit</text><text x="808" y="294">Operate with feedback</text><text x="992" y="294">Revise from evidence</text></g>
  </g><path d="M1128 270c0 102-100 142-200 142" fill="none" stroke="#D2A8FF" stroke-opacity=".55" stroke-dasharray="5 7"/><text x="744" y="436" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">feedback changes the next framing</text>
</svg>
