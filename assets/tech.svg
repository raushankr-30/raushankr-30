<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Technology ecosystem</title><desc id="desc">A map of Python and TypeScript connected to intelligent systems, product applications, data, and delivery practices.</desc>
  <defs><symbol id="capsule" viewBox="0 0 130 40"><rect width="130" height="40" rx="20" fill="#161B22" stroke="#30363D"/></symbol><filter id="tech-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" fill="#0D1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="48" y="52" fill="#58A6FF" font-size="14" font-weight="700" letter-spacing="2">TECHNOLOGY ECOSYSTEM / 05</text><text x="48" y="92" fill="#F0F6FC" font-size="30" font-weight="700">Tools belong to relationships, not lists.</text><text x="48" y="124" fill="#8B949E" font-size="16">Technology is selected for the boundary it strengthens.</text></g>
  <g aria-label="Technology relationship map" fill="none" stroke="#8B949E" stroke-opacity=".55"><path d="M406 268l172-78M406 268l172 78M794 268l-172-78M794 268l-172 78M600 250v-80M600 286v82"/><path d="M406 268h388" stroke="#58A6FF" stroke-opacity=".5" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" values="28;0" dur="2.4s" repeatCount="indefinite"/></path></g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle"><g aria-label="Python"><circle cx="406" cy="268" r="54" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><text x="406" y="274" fill="#F0F6FC" font-size="20" font-weight="700">Python</text></g><g aria-label="TypeScript"><circle cx="794" cy="268" r="54" fill="#161B22" stroke="#D2A8FF" stroke-width="2"/><text x="794" y="274" fill="#F0F6FC" font-size="20" font-weight="700">TypeScript</text></g><g aria-label="Intelligent systems"><use href="#capsule" x="535" y="150" width="130" height="40"/><text x="600" y="176" fill="#F0F6FC" font-size="14">Intelligent systems</text></g><g aria-label="Product applications"><use href="#capsule" x="535" y="350" width="130" height="40"/><text x="600" y="376" fill="#F0F6FC" font-size="14">Product applications</text></g><g aria-label="Data"><use href="#capsule" x="234" y="248" width="130" height="40"/><text x="299" y="274" fill="#F0F6FC" font-size="14">Data &amp; models</text></g><g aria-label="Delivery"><use href="#capsule" x="836" y="248" width="130" height="40"/><text x="901" y="274" fill="#F0F6FC" font-size="14">Delivery &amp; UX</text></g></g>
  <g aria-label="Technology context" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="48" y="472" fill="#8B949E" font-size="13">CONTEXT</text><text x="152" y="472" fill="#F0F6FC" font-size="13">Python for perception, data, and automation. TypeScript for product surfaces and service contracts.</text></g>
</svg>
