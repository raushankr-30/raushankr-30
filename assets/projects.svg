<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 712" role="img" aria-labelledby="title desc">
  <title id="title">Featured engineering projects</title><desc id="desc">Three project cards for RoadGuardian AI, CareerPilot AI, and customer segmentation.</desc>
  <defs>
    <symbol id="card" viewBox="0 0 100 100"><rect width="100" height="100" rx="8" fill="#161B22" stroke="#30363D"/></symbol>
    <symbol id="arrow" viewBox="0 0 20 20"><path d="M4 10h11M10 5l5 5-5 5" fill="none" stroke="#58A6FF" stroke-width="1.5"/></symbol>
    <clipPath id="cards"><rect x="48" y="124" width="1104" height="540" rx="8"/></clipPath>
  </defs>
  <rect width="1200" height="712" fill="#0D1117"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="48" y="52" fill="#58A6FF" font-size="14" font-weight="700" letter-spacing="2">FEATURED PROJECTS / 03</text><text x="48" y="92" fill="#F0F6FC" font-size="30" font-weight="700">Products shaped as systems.</text></g>
  <g aria-label="Project cards" clip-path="url(#cards)"><use href="#card" x="48" y="124" width="352" height="540"/><use href="#card" x="424" y="124" width="352" height="540"/><use href="#card" x="800" y="124" width="352" height="540"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <g aria-label="RoadGuardian AI project"><path d="M72 156h304" stroke="#3FB950" stroke-width="3"/><text x="72" y="198" fill="#F0F6FC" font-size="24" font-weight="700">RoadGuardian AI</text><text x="72" y="230" fill="#8B949E" font-size="15">Offline edge-AI road intelligence</text><text x="72" y="278" fill="#8B949E" font-size="12" font-weight="700" letter-spacing="1">ARCHITECTURE</text><text x="72" y="306" fill="#F0F6FC" font-size="15">Perception → understanding → risk</text><text x="72" y="334" fill="#F0F6FC" font-size="15">fusion → decision alerts</text><text x="72" y="382" fill="#8B949E" font-size="12" font-weight="700" letter-spacing="1">ENGINEERING DECISION</text><text x="72" y="410" fill="#F0F6FC" font-size="15">Modular package boundaries keep</text><text x="72" y="438" fill="#F0F6FC" font-size="15">hardware and model concerns separate.</text><text x="72" y="480" fill="#3FB950" font-size="12" font-weight="700" letter-spacing="1">OUTCOME</text><text x="72" y="504" fill="#F0F6FC" font-size="14">A testable, staged training foundation.</text><text x="72" y="536" fill="#8B949E" font-size="12">Python · YOLO · OpenCV · YAML</text><path d="M72 604h280" stroke="#30363D"/><text x="72" y="638" fill="#58A6FF" font-size="14">VIEW REPOSITORY</text><use href="#arrow" x="328" y="622" width="20" height="20"/></g>
    <g aria-label="CareerPilot AI project"><path d="M448 156h304" stroke="#58A6FF" stroke-width="3"/><text x="448" y="198" fill="#F0F6FC" font-size="24" font-weight="700">CareerPilot AI</text><text x="448" y="230" fill="#8B949E" font-size="15">AI-powered interview preparation</text><text x="448" y="278" fill="#8B949E" font-size="12" font-weight="700" letter-spacing="1">ARCHITECTURE</text><text x="448" y="306" fill="#F0F6FC" font-size="15">Candidate workflow from profile</text><text x="448" y="334" fill="#F0F6FC" font-size="15">through progress and dashboard</text><text x="448" y="382" fill="#8B949E" font-size="12" font-weight="700" letter-spacing="1">ENGINEERING DECISION</text><text x="448" y="410" fill="#F0F6FC" font-size="15">Start with a narrow, useful path</text><text x="448" y="438" fill="#F0F6FC" font-size="15">before extending the platform.</text><text x="448" y="480" fill="#58A6FF" font-size="12" font-weight="700" letter-spacing="1">OUTCOME</text><text x="448" y="504" fill="#F0F6FC" font-size="14">A clear first-release candidate journey.</text><text x="448" y="536" fill="#8B949E" font-size="12">Next.js · NestJS · PostgreSQL · Prisma</text><path d="M448 604h280" stroke="#30363D"/><text x="448" y="638" fill="#58A6FF" font-size="14">VIEW REPOSITORY</text><use href="#arrow" x="704" y="622" width="20" height="20"/></g>
    <g aria-label="Customer segmentation project"><path d="M824 156h304" stroke="#D2A8FF" stroke-width="3"/><text x="824" y="198" fill="#F0F6FC" font-size="24" font-weight="700">Customer Signals</text><text x="824" y="230" fill="#8B949E" font-size="15">Behavioral segmentation study</text><text x="824" y="278" fill="#8B949E" font-size="12" font-weight="700" letter-spacing="1">ARCHITECTURE</text><text x="824" y="306" fill="#F0F6FC" font-size="15">Data hygiene → clustering →</text><text x="824" y="334" fill="#F0F6FC" font-size="15">interpretation → recommendations</text><text x="824" y="382" fill="#8B949E" font-size="12" font-weight="700" letter-spacing="1">ENGINEERING DECISION</text><text x="824" y="410" fill="#F0F6FC" font-size="15">Pair model selection with visual</text><text x="824" y="438" fill="#F0F6FC" font-size="15">evidence a product team can use.</text><text x="824" y="480" fill="#D2A8FF" font-size="12" font-weight="700" letter-spacing="1">OUTCOME</text><text x="824" y="504" fill="#F0F6FC" font-size="14">Reusable analysis and reporting artifacts.</text><text x="824" y="536" fill="#8B949E" font-size="12">Python · K-Means · analytics</text><path d="M824 604h280" stroke="#30363D"/><text x="824" y="638" fill="#58A6FF" font-size="14">VIEW REPOSITORY</text><use href="#arrow" x="1080" y="622" width="20" height="20"/></g>
  </g>
</svg>
