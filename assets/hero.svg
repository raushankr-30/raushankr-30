<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Raushan Kumar — Engineering systems</title><desc id="desc">An animated engineering blueprint introducing Raushan Kumar, a product engineer building intelligent systems and dependable software platforms.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#30363D" stroke-opacity=".45"/></pattern>
    <linearGradient id="hero-line" x1="0" x2="1"><stop stop-color="#58A6FF" stop-opacity="0"/><stop offset=".45" stop-color="#58A6FF"/><stop offset="1" stop-color="#D2A8FF"/></linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="blueprint-node" viewBox="0 0 160 72"><rect width="160" height="72" rx="6" fill="#161B22" stroke="#30363D"/><path d="M16 20h32M16 28h72M16 52h128" stroke="#8B949E" stroke-opacity=".6"/><circle cx="136" cy="24" r="6" fill="#3FB950"/></symbol>
    <clipPath id="blueprint-clip"><rect x="624" y="88" width="512" height="336" rx="12"/></clipPath>
  </defs>
  <rect width="1200" height="520" fill="#0D1117"/><rect width="1200" height="520" fill="url(#grid)"/>
  <g aria-label="Identity" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="64" y="104" fill="#58A6FF" font-size="14" font-weight="700" letter-spacing="2">ENGINEERING SYSTEMS / 01</text>
    <text x="64" y="180" fill="#F0F6FC" font-size="54" font-weight="700">Raushan Kumar</text>
    <text x="64" y="226" fill="#F0F6FC" font-size="28">Product engineer for intelligent, dependable software.</text>
    <text x="64" y="272" fill="#8B949E" font-size="18">I turn uncertain problems into legible systems—where product intent,</text>
    <text x="64" y="300" fill="#8B949E" font-size="18">interfaces, models, and operations can evolve together.</text>
    <g aria-label="Focus areas"><rect x="64" y="344" width="150" height="32" rx="16" fill="#161B22" stroke="#30363D"/><text x="84" y="365" fill="#F0F6FC" font-size="14">AI-Native Products</text><rect x="226" y="344" width="164" height="32" rx="16" fill="#161B22" stroke="#30363D"/><text x="246" y="365" fill="#F0F6FC" font-size="14">Software Architecture</text></g>
  </g>
  <g aria-label="Animated engineering blueprint" clip-path="url(#blueprint-clip)">
    <rect x="624" y="88" width="512" height="336" rx="12" fill="#0D1117" stroke="#30363D"/><path d="M624 144h512M688 88v336M1056 88v336" stroke="#30363D"/>
    <path d="M704 228h90l42-58h80l46 58h92" fill="none" stroke="url(#hero-line)" stroke-width="2" filter="url(#soft-glow)" stroke-dasharray="440" stroke-dashoffset="440"><animate attributeName="stroke-dashoffset" values="440;0" dur="2.8s" repeatCount="indefinite"/></path>
    <path d="M756 322h98l44-56h82" fill="none" stroke="#58A6FF" stroke-opacity=".65" stroke-width="2" stroke-dasharray="320" stroke-dashoffset="320"><animate attributeName="stroke-dashoffset" values="320;0" dur="3.6s" begin=".6s" repeatCount="indefinite"/></path>
    <use href="#blueprint-node" x="704" y="132" width="160" height="72"/><use href="#blueprint-node" x="896" y="132" width="160" height="72"/><use href="#blueprint-node" x="776" y="286" width="160" height="72"/>
    <g fill="#F0F6FC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12"><text x="720" y="178">SIGNAL INTAKE</text><text x="912" y="178">DECISION MODEL</text><text x="792" y="332">PRODUCT INTERFACE</text></g>
    <circle cx="836" cy="170" r="4" fill="#58A6FF"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle><circle cx="962" cy="228" r="4" fill="#D2A8FF"><animate attributeName="opacity" values=".35;1;.35" dur="2s" begin=".6s" repeatCount="indefinite"/></circle>
  </g>
  <g aria-label="Blueprint annotation" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><path d="M624 456h512" stroke="#58A6FF" stroke-opacity=".5"/><text x="624" y="484" fill="#8B949E" font-size="13">OBSERVE → MODEL → SHIP → LEARN</text><text x="1056" y="484" fill="#8B949E" font-size="13">REV 01</text></g>
</svg>
