<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">Visual component primitives</title><desc id="desc">Reusable visual primitives for the profile identity system.</desc>
  <defs>
    <symbol id="panel" viewBox="0 0 100 60"><rect width="100" height="60" rx="4" fill="#161B22" stroke="#30363D"/></symbol>
    <symbol id="status" viewBox="0 0 100 24"><rect width="100" height="24" rx="12" fill="#0D1117" stroke="#30363D"/><circle cx="14" cy="12" r="4" fill="#3FB950"/></symbol>
    <symbol id="node" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#58A6FF"/></symbol>
    <linearGradient id="blueprint" x1="0" x2="1"><stop stop-color="#58A6FF" stop-opacity=".12"/><stop offset="1" stop-color="#D2A8FF" stop-opacity=".05"/></linearGradient>
  </defs>
  <g aria-label="Component library"><use href="#panel" x="16" y="16" width="180" height="108"/><use href="#status" x="228" y="16" width="180" height="43"/><use href="#node" x="444" y="16" width="43" height="43"/></g>
</svg>
