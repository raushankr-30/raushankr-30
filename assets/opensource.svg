<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 432" role="img" aria-labelledby="title desc">
  <title id="title">Open-source practice</title><desc id="desc">Open-source philosophy, maintenance philosophy, contribution areas, and future research themes.</desc>
  <defs><symbol id="tile" viewBox="0 0 100 100"><rect width="100" height="100" rx="8" fill="#161B22" stroke="#30363D"/></symbol><symbol id="mark" viewBox="0 0 16 16"><path d="M3 8l3 3 7-7" fill="none" stroke="#3FB950" stroke-width="2"/></symbol></defs><rect width="1200" height="432" fill="#0D1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="48" y="52" fill="#58A6FF" font-size="14" font-weight="700" letter-spacing="2">OPEN SOURCE / 08</text><text x="48" y="92" fill="#F0F6FC" font-size="30" font-weight="700">Software should stay understandable after it ships.</text></g>
  <g aria-label="Open source principles"><use href="#tile" x="48" y="132" width="256" height="224"/><use href="#tile" x="328" y="132" width="256" height="224"/><use href="#tile" x="608" y="132" width="256" height="224"/><use href="#tile" x="888" y="132" width="264" height="224"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><g aria-label="Engineering philosophy"><use href="#mark" x="72" y="160" width="16" height="16"/><text x="72" y="216" fill="#F0F6FC" font-size="18" font-weight="700">Engineering philosophy</text><text x="72" y="250" fill="#8B949E" font-size="14">Readable boundaries.</text><text x="72" y="276" fill="#8B949E" font-size="14">Testable assumptions.</text></g><g aria-label="Maintenance philosophy"><use href="#mark" x="352" y="160" width="16" height="16"/><text x="352" y="216" fill="#F0F6FC" font-size="18" font-weight="700">Maintenance philosophy</text><text x="352" y="250" fill="#8B949E" font-size="14">Small changes that keep</text><text x="352" y="276" fill="#8B949E" font-size="14">future changes affordable.</text></g><g aria-label="Contribution areas"><use href="#mark" x="632" y="160" width="16" height="16"/><text x="632" y="216" fill="#F0F6FC" font-size="18" font-weight="700">Contribution areas</text><text x="632" y="250" fill="#8B949E" font-size="14">AI systems · product tooling</text><text x="632" y="276" fill="#8B949E" font-size="14">data workflows · DX</text></g><g aria-label="Research direction"><use href="#mark" x="912" y="160" width="16" height="16"/><text x="912" y="216" fill="#F0F6FC" font-size="18" font-weight="700">Research direction</text><text x="912" y="250" fill="#8B949E" font-size="14">Explainable signals and</text><text x="912" y="276" fill="#8B949E" font-size="14">risk-aware decision systems.</text></g></g>
</svg>
