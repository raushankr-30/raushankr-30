<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" role="img" aria-labelledby="title desc">
  <title id="title">Engineering signals</title><desc id="desc">A compact bridge from native GitHub contribution, repository, activity, and language signals to the current engineering focus.</desc>
  <defs>
    <symbol id="panel" viewBox="0 0 100 100"><rect width="100" height="100" rx="8" fill="#161B22" stroke="#30363D"/></symbol>
    <symbol id="status" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4" fill="#3FB950"/></symbol>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#58A6FF"/><stop offset="1" stop-color="#D2A8FF"/></linearGradient>
  </defs>
  <rect width="1200" height="476" fill="#0D1117"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="48" y="52" fill="#58A6FF" font-size="14" font-weight="700" letter-spacing="2">ENGINEERING SIGNALS / 02</text><text x="48" y="92" fill="#F0F6FC" font-size="30" font-weight="700">GitHub activity, read in system context.</text></g>
  <g aria-label="Dashboard panels">
    <use href="#panel" x="48" y="124" width="536" height="144"/><use href="#panel" x="616" y="124" width="536" height="144"/><use href="#panel" x="48" y="300" width="344" height="128"/><use href="#panel" x="424" y="300" width="344" height="128"/><use href="#panel" x="800" y="300" width="352" height="128"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <g aria-label="Native GitHub surfaces"><text x="72" y="156" fill="#8B949E" font-size="13" font-weight="700" letter-spacing="1.5">NATIVE GITHUB SURFACES</text><text x="72" y="196" fill="#F0F6FC" font-size="22" font-weight="600">Contributions, repositories, activity</text><text x="72" y="226" fill="#8B949E" font-size="16">GitHub remains the visible record of engineering work.</text></g>
    <g aria-label="Current focus"><use href="#status" x="640" y="146" width="12" height="12"/><text x="664" y="156" fill="#8B949E" font-size="13" font-weight="700" letter-spacing="1.5">CURRENT FOCUS</text><text x="640" y="196" fill="#F0F6FC" font-size="22" font-weight="600">Edge-AI road intelligence</text><text x="640" y="226" fill="#8B949E" font-size="16">Perception, risk fusion, and explainable alerts.</text></g>
    <g aria-label="Engineering principles"><text x="72" y="332" fill="#8B949E" font-size="13" font-weight="700" letter-spacing="1.5">ENGINEERING METHOD</text><text x="72" y="368" fill="#F0F6FC" font-size="17">Evidence before certainty</text><text x="72" y="400" fill="#F0F6FC" font-size="17">Interfaces before internals</text></g>
    <g aria-label="Domains"><text x="448" y="332" fill="#8B949E" font-size="13" font-weight="700" letter-spacing="1.5">GITHUB EVIDENCE</text><text x="448" y="368" fill="#F0F6FC" font-size="17">Commits · languages · reviews</text><text x="448" y="400" fill="#F0F6FC" font-size="17">Stars · forks · issue history</text></g>
    <g aria-label="Current build"><text x="824" y="332" fill="#8B949E" font-size="13" font-weight="700" letter-spacing="1.5">CURRENT BUILD</text><path d="M824 364h280" stroke="url(#accent)" stroke-width="2"/><circle cx="918" cy="364" r="6" fill="#58A6FF"/><text x="824" y="400" fill="#F0F6FC" font-size="17">RoadGuardian AI / training phase</text></g>
  </g>
</svg>
